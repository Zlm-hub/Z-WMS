# Z-WMS 全链路自动化测试 CI
# 四个 job 覆盖四种数据库：
#   e2e           SQLite 种子库，跑全部 7 套件（含 UI 渲染）
#   e2e-mysql     MySQL 8，跑 API 驱动套件 s1/s4/s7
#   e2e-postgres  PostgreSQL 16，同上
#   e2e-sqlserver SQL Server 2022，同上
# 说明：
# - 非 SQLite 三档只跑 API 套件：v2 前端 API 基址写死 hostname:20011，而这三档
#   后端分别起在 20012/20013/20014，前端连不上
# - 建库脚本由 rebuild/tools/schemagen（EF 模型）+ seed2sql.py（SQLite seed 转换）生成
# 说明：
# - ubuntu-latest runner 自带 Google Chrome（/usr/bin/google-chrome），测试框架
#   通过 WMS_CHROME 环境变量指定，用裸 CDP 驱动 headless 渲染验证
# - 测试数据每次运行自建（RT<tag> 唯一前缀）并在套件内自清洁，可重复执行
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Chrome (runner 自带)
        run: |
          google-chrome --version || test -x /usr/bin/google-chrome || {
            echo "::error::google-chrome not found on runner"
            exit 1
          }

      - name: Build frontend-v2
        run: cd frontend-v2 && npm ci && npm run build

      - name: Build backend image
        run: docker build -f rebuild/backend.Dockerfile -t modernwms-backend:latest .

      - name: Start stack (backend + frontend-v2)
        run: cd rebuild && docker compose up -d --build backend frontend-v2

      - name: Wait for API ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:20011/login \
              -H 'Content-Type: application/json' -d '{"user_name":"admin","password":"1"}' || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 3
          done
          echo "::error::backend not ready in 180s"
          docker compose -f rebuild/docker-compose.yml logs backend
          exit 1

      - name: Run test suites
        env:
          WMS_API: http://localhost:20011
          WMS_BASE: http://localhost:8081
          WMS_CHROME: /usr/bin/google-chrome
          WMS_PAGE_SETTLE: '6000'
        run: node tests/run-all.js

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            /tmp/zwms_test_out/
          if-no-files-found: ignore

  # MySQL 档：EF 生成 DDL + seed 转换数据建库，验证四库切换（UI 套件依赖 v2 前端
  # 写死的 :20011 API 基址，MySQL 后端在 20012，故只跑 API 驱动套件 s1/s4/s7）
  e2e-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: modernwms
          MYSQL_DATABASE: wms
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pmodernwms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend image
        run: docker build -f rebuild/backend.Dockerfile -t modernwms-backend:latest .

      - name: Import MySQL schema + seed
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE/rebuild/seed:/seeds" mysql:8.0 \
            sh -c "mysql -h127.0.0.1 -uroot -pmodernwms --default-character-set=utf8mb4 wms < /seeds/mysql_schema.sql && \
                   mysql -h127.0.0.1 -uroot -pmodernwms --default-character-set=utf8mb4 wms < /seeds/mysql_seed.sql"
          docker run --rm --network host mysql:8.0 \
            mysql -h127.0.0.1 -uroot -pmodernwms wms -e "SELECT COUNT(*) AS menus FROM menu; SELECT COUNT(*) AS users FROM user;"

      - name: Start backend (MySql mode)
        run: |
          docker run -d --name backend-mysql \
            --add-host=host.docker.internal:host-gateway \
            -p 20012:20011 \
            -e "Database__db=MySql" \
            -e "ConnectionStrings__MySqlConn=Server=host.docker.internal;Database=wms;Port=3306;charset=utf8mb4;uid=root;pwd=modernwms;" \
            -e "WMS_JWT_SIGNINGKEY=ci-mysql-key-8f4e2a91c7d5b3e6a0f9d8c7b2e4a6f1d3c5e7b9a2f4d6c8e0b2a4f6d8c1e3a5" \
            modernwms-backend:latest

      - name: Wait for API ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:20012/login \
              -H 'Content-Type: application/json' -d '{"user_name":"admin","password":"1"}' || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 3
          done
          echo "::error::mysql backend not ready in 180s"
          docker logs backend-mysql
          exit 1

      - name: Run API suites on MySQL
        env:
          WMS_API: http://localhost:20012
        run: node tests/run-all.js s1 s4 s7

      - name: Upload mysql test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-mysql
          path: |
            /tmp/zwms_test_out/
          if-no-files-found: ignore

  # PostgreSQL 档：与 MySQL 档同构，脚本由 schemagen/seed2sql.py 生成
  # 注意：显式插入 id 后必须 setval 同步 identity 序列（seed 脚本已含）
  e2e-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: modernwms
          POSTGRES_DB: wms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend image
        run: docker build -f rebuild/backend.Dockerfile -t modernwms-backend:latest .

      - name: Import PostgreSQL schema + seed
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE/rebuild/seed:/seeds" postgres:16 \
            sh -c "psql -h127.0.0.1 -U postgres -d wms -v ON_ERROR_STOP=1 -f /seeds/postgres_schema.sql && \
                   psql -h127.0.0.1 -U postgres -d wms -v ON_ERROR_STOP=1 -f /seeds/postgres_seed.sql"
          docker run --rm --network host postgres:16 \
            psql -h127.0.0.1 -U postgres -d wms -c 'SELECT COUNT(*) AS menus FROM menu;' -c 'SELECT COUNT(*) AS users FROM "user";'

      - name: Start backend (PostGres mode)
        run: |
          docker run -d --name backend-postgres \
            --add-host=host.docker.internal:host-gateway \
            -p 20013:20011 \
            -e "Database__db=PostGres" \
            -e "ConnectionStrings__PostGresConn=Server=host.docker.internal;Port=5432;User Id=postgres;Password=modernwms;Database=wms;" \
            -e "WMS_JWT_SIGNINGKEY=ci-postgres-key-8f4e2a91c7d5b3e6a0f9d8c7b2e4a6f1d3c5e7b9a2f4d6c8e0b2a4f6d8c1e3a5" \
            modernwms-backend:latest

      - name: Wait for API ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:20013/login \
              -H 'Content-Type: application/json' -d '{"user_name":"admin","password":"1"}' || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 3
          done
          echo "::error::postgres backend not ready in 180s"
          docker logs backend-postgres
          exit 1

      - name: Run API suites on PostgreSQL
        env:
          WMS_API: http://localhost:20013
        run: node tests/run-all.js s1 s4 s7

      - name: Upload postgres test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-postgres
          path: |
            /tmp/zwms_test_out/
          if-no-files-found: ignore

  # SQL Server 档：同上；sqlcmd 用容器内的 mssql-tools18（-C 信任自签证书）
  # seed 脚本用 SET IDENTITY_INSERT ON/OFF 包裹显式 id 插入
  e2e-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Modernwms#2026'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Modernwms#2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend image
        run: docker build -f rebuild/backend.Dockerfile -t modernwms-backend:latest .

      - name: Import SQL Server schema + seed
        run: |
          SQ="docker run --rm --network host -v $GITHUB_WORKSPACE/rebuild/seed:/seeds mcr.microsoft.com/mssql/server:2022-latest /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'Modernwms#2026' -C"
          $SQ -Q "CREATE DATABASE wms"
          $SQ -d wms -i /seeds/sqlserver_schema.sql
          $SQ -d wms -i /seeds/sqlserver_seed.sql
          $SQ -d wms -Q "SELECT COUNT(*) AS menus FROM menu; SELECT COUNT(*) AS users FROM [user];"

      - name: Start backend (SqlServer mode)
        run: |
          docker run -d --name backend-sqlserver \
            --add-host=host.docker.internal:host-gateway \
            -p 20014:20011 \
            -e "Database__db=SqlServer" \
            -e "ConnectionStrings__SqlServerConn=Data Source=host.docker.internal,1433;User ID=sa;Password=Modernwms#2026;Initial Catalog=wms;Encrypt=False;TrustServerCertificate=True;" \
            -e "WMS_JWT_SIGNINGKEY=ci-sqlserver-key-8f4e2a91c7d5b3e6a0f9d8c7b2e4a6f1d3c5e7b9a2f4d6c8e0b2a4f6d8c1e3a5" \
            modernwms-backend:latest

      - name: Wait for API ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:20014/login \
              -H 'Content-Type: application/json' -d '{"user_name":"admin","password":"1"}' || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 3
          done
          echo "::error::sqlserver backend not ready in 180s"
          docker logs backend-sqlserver
          exit 1

      - name: Run API suites on SQL Server
        env:
          WMS_API: http://localhost:20014
        run: node tests/run-all.js s1 s4 s7

      - name: Upload sqlserver test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-sqlserver
          path: |
            /tmp/zwms_test_out/
          if-no-files-found: ignore
